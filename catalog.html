<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Library | Book Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">📚 City Digital Library</a>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="catalog.html" class="active">Book Catalog</a></li>
          <li><a href="add-book.html">Add New Book</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>Book Catalog</h1>
      <p>Search by title or author and click the action button to issue or return a book.</p>
    </section>

    <!-- Search & Filter Controls -->
    <section class="controls-bar" aria-label="Search and Filter">
      <div class="search-box">
        <label for="search-input" class="sr-only">Search by title or author</label>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search by book title or author..."
        >
      </div>

      <div class="filter-box">
        <label for="status-filter" class="sr-only">Filter by status</label>
        <select id="status-filter">
          <option value="all">All Statuses</option>
          <option value="Available">Available</option>
          <option value="Issued">Issued</option>
        </select>
      </div>
    </section>

    <!-- Books Table -->
    <section class="table-container">
      <table id="books-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Genre</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="books-tbody">
          <!-- Rows populated dynamically via script.js -->
        </tbody>
      </table>
      <p id="no-results" class="empty-message hidden">No books match your search criteria.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Digital Library Catalog Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
